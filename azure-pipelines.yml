trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: "ubuntu-latest"

variables:
  NODE_VERSION: "22.x"
  PLANIT_BASE_URL: "https://jupiter.cloud.planittesting.com"

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "$(NODE_VERSION)"
    displayName: "Use Node.js $(NODE_VERSION)"

  - script: npm ci
    displayName: "Install dependencies"

  - script: npx playwright install --with-deps chromium
    displayName: "Install Chromium"

  - script: npm run lint
    displayName: "Lint assessment"

  - script: npm run typecheck
    displayName: "Typecheck assessment"

  - script: npm run test:assessment
    displayName: "Run Planit assessment tests"
    env:
      PLANIT_BASE_URL: $(PLANIT_BASE_URL)
      CI: "true"

  - script: npm run test:assessment:repeat
    displayName: "Run contact submission five times"
    env:
      PLANIT_BASE_URL: $(PLANIT_BASE_URL)
      CI: "true"

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: "playwright-report"
      artifact: "planit-assessment-report"
    displayName: "Publish Playwright report"